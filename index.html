<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menù Mensa</title>
  <meta name="description" content="Il menù della mensa scolastica, ogni giorno e ogni mese.">
  <meta name="theme-color" content="#1c4587">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Menù Mensa">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="barra">
  <h1 class="barra-titolo">Menù Mensa</h1>
  <button class="btn-icona" id="btn-condividi-app" aria-label="Condividi l'app con gli altri genitori">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    <span>Condividi l'app</span>
  </button>
</header>

<aside id="invito-installa" class="invito" hidden>
  <p id="invito-testo"></p>
  <div class="invito-azioni">
    <button class="btn-pieno" id="btn-installa" hidden>Installa</button>
    <button class="btn-testo" id="btn-chiudi-invito">Non ora</button>
  </div>
</aside>

<main class="contenuto">
  <div class="stagione" id="stagione" role="status"></div>

  <!-- ========== VISTA GIORNALIERA ========== -->
  <section id="vista-oggi" aria-labelledby="data-titolo">
    <div class="nav-riga">
      <button class="btn-freccia" id="giorno-prec" aria-label="Giorno precedente">&#9664;</button>
      <div class="nav-centro">
        <h2 class="nav-titolo" id="data-titolo">Caricamento...</h2>
        <span class="chip" id="chip-settimana"></span>
      </div>
      <button class="btn-freccia" id="giorno-succ" aria-label="Giorno successivo">&#9654;</button>
    </div>
    <div class="azioni-riga">
      <button class="btn-pieno" id="giorno-oggi">Torna a oggi</button>
      <button class="btn-bordo" id="btn-condividi-giorno">Condividi il menù</button>
    </div>
    <div id="piatti" class="piatti"></div>
    <p id="nota-surgelati" class="nota" hidden>* prodotto surgelato</p>
  </section>

  <!-- ========== VISTA MENSILE ========== -->
  <section id="vista-mese" aria-labelledby="mese-titolo" hidden>
    <div class="nav-riga">
      <button class="btn-freccia" id="mese-prec" aria-label="Mese precedente">&#9664;</button>
      <div class="nav-centro">
        <h2 class="nav-titolo" id="mese-titolo">Mese</h2>
      </div>
      <button class="btn-freccia" id="mese-succ" aria-label="Mese successivo">&#9654;</button>
    </div>
    <div class="azioni-riga">
      <button class="btn-pieno" id="mese-oggi">Torna a oggi</button>
    </div>
    <div id="settimane" class="settimane"></div>
    <p id="nota-mese" class="nota">* prodotto surgelato &middot; tocca un giorno per aprirlo</p>
  </section>
</main>

<nav class="tabbar" aria-label="Sezioni">
  <button class="tab attiva" id="tab-oggi" aria-current="page">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>
    <span>Giorno</span>
  </button>
  <button class="tab" id="tab-mese">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    <span>Mese</span>
  </button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="menu-data.js"></script>
<script src="app.js"></script>
</body>
</html>
