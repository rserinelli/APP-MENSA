<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Menù Mensa</title>
  <meta name="description" content="Il menù della mensa scolastica, ogni giorno e ogni mese.">
  <meta name="theme-color" content="#1c4587">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Menù Mensa">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="testata">
  <h1 class="testata-titolo">
    <span class="testata-menu">Menù Mensa</span>
    <img class="testata-logo" src="img/barbarigo.png" alt="Barbarigo" width="737" height="216">
  </h1>
</header>



<main class="contenuto">
  <div class="scarica" id="blocco-scarica" hidden>
    <button class="btn-scarica" id="btn-scarica">
      <span class="scarica-icona" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
      </span>
      <span class="scarica-testi">
        <span class="scarica-titolo">SCARICA L'APP</span>
        <span class="scarica-sotto">Gratis &middot; in pochi secondi</span>
      </span>
    </button>
  </div>

  <div class="stagione" id="stagione" role="status"></div>

  <!-- ========== VISTA GIORNALIERA ========== -->
  <section id="vista-oggi" aria-labelledby="data-titolo">
    <div class="nav-riga">
      <button class="btn-freccia" id="giorno-prec" aria-label="Giorno precedente">&#9664;</button>
      <div class="nav-centro">
        <h2 class="nav-titolo" id="data-titolo">Caricamento...</h2>
        <span class="chip" id="chip-settimana"></span>
      </div>
      <button class="btn-freccia" id="giorno-succ" aria-label="Giorno successivo">&#9654;</button>
    </div>
    <div class="azioni-riga">
      <button class="btn-pieno" id="giorno-oggi">Torna a oggi</button>
      <button class="btn-bordo" id="btn-condividi-giorno">Condividi il menù</button>
    </div>
    <div id="piatti" class="piatti"></div>
    <p id="nota-surgelati" class="nota" hidden>* prodotto surgelato</p>
  </section>

  <!-- ========== VISTA MENSILE ========== -->
  <section id="vista-mese" aria-labelledby="mese-titolo" hidden>
    <div class="nav-riga">
      <button class="btn-freccia" id="mese-prec" aria-label="Mese precedente">&#9664;</button>
      <div class="nav-centro">
        <h2 class="nav-titolo" id="mese-titolo">Mese</h2>
      </div>
      <button class="btn-freccia" id="mese-succ" aria-label="Mese successivo">&#9654;</button>
    </div>
    <div class="azioni-riga">
      <button class="btn-pieno" id="mese-oggi">Torna a oggi</button>
    </div>
    <div class="scroll-hint">&harr; Scorri di lato per vedere tutta la settimana</div>
    <div class="calendar-wrapper">
      <table class="calendar-table">
        <thead>
          <tr>
            <th class="week-label-head">SETTIMANA</th>
            <th>LUNEDÌ</th>
            <th>MARTEDÌ</th>
            <th>MERCOLEDÌ</th>
            <th>GIOVEDÌ</th>
            <th>VENERDÌ</th>
          </tr>
        </thead>
        <tbody id="calendar-body"></tbody>
      </table>
    </div>
    <p id="nota-mese" class="footer-note">*prodotto surgelato</p>
  </section>
</main>

<nav class="tabbar" aria-label="Sezioni">
  <button class="tab attiva" id="tab-oggi" aria-current="page">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>
    <span>Giorno</span>
  </button>
  <button class="tab" id="tab-mese">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    <span>Mese</span>
  </button>
  <button class="tab" id="tab-condividi" aria-label="Condividi l'app con gli altri genitori">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    <span>Condividi app</span>
  </button>
</nav>

<div class="guida" id="guida" role="dialog" aria-modal="true" aria-labelledby="guida-titolo" hidden>
  <div class="guida-scheda">
    <h2 id="guida-titolo" class="guida-titolo">Scarica l'app</h2>
    <p id="guida-avviso" class="guida-avviso" hidden></p>
    <ol id="guida-passi" class="guida-passi"></ol>
    <p id="guida-nota" class="guida-nota"></p>
    <button class="btn-pieno btn-largo" id="guida-chiudi">Ho capito</button>
  </div>
</div>

<div class="errore-app" id="errore-app" role="alert" hidden>
  <div class="errore-scheda">
    <p>L'app non si è caricata bene.</p>
    <button class="btn-pieno btn-largo" id="btn-ripara">Ripara e ricarica</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
  // Rete di sicurezza: se l'app non parte, compare il pulsante per ripararla da soli
  (function () {
    function mostra() {
      var b = document.getElementById('errore-app');
      if (b && !document.documentElement.getAttribute('data-pronto')) b.hidden = false;
    }
    window.addEventListener('error', function () { setTimeout(mostra, 400); }, true);
    setTimeout(mostra, 4000);
    document.addEventListener('click', function (e) {
      if (!e.target || e.target.id !== 'btn-ripara') return;
      var fatto = false;
      function vai() { if (fatto) return; fatto = true; location.reload(); }
      setTimeout(vai, 2500);
      var p = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        p.push(navigator.serviceWorker.getRegistrations().then(function (r) {
          return Promise.all(r.map(function (x) { return x.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        p.push(caches.keys().then(function (k) {
          return Promise.all(k.map(function (x) { return caches.delete(x); }));
        }));
      }
      Promise.all(p).then(vai, vai);
    });
  })();
</script>
<script src="menu-data.js"></script>
<script src="app.js"></script>
</body>
</html>
